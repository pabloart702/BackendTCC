# Configuração do Eclipse Mosquitto - TCC Monitor de Ar-Condicionado

# Listener padrão MQTT (ESP32, Backend e clientes TCP)
listener 1883 0.0.0.0

# Listener MQTT via WebSockets (para clientes Web no navegador)
listener 9001 0.0.0.0
protocol websockets

# Desabilitar conexões anônimas (exige autenticação por usuário e senha)
allow_anonymous false
password_file /mosquitto/config/passwd

# Persistência de mensagens (QoS > 0 e mensagens Retain)
persistence true
persistence_location /mosquitto/data/

# Logs de eventos e conexões
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
